<VirtualHost *:80>
    ServerName vitamine.cloud
    ServerAlias www.vitamine.cloud

    RewriteEngine On
    RewriteRule ^ https://vitamine.cloud%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/vitamine-cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/vitamine-cloud-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vitamine.cloud
    ServerAlias www.vitamine.cloud

    ProxyPreserveHost On
    ProxyTimeout 600
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    ErrorLog ${APACHE_LOG_DIR}/vitamine-cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/vitamine-cloud-access.log combined

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/vitamine.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vitamine.cloud/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
