<VirtualHost *:80>
    ServerName vita.space
    ServerAlias www.vita.space

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    ErrorLog ${APACHE_LOG_DIR}/vita-space-error.log
    CustomLog ${APACHE_LOG_DIR}/vita-space-access.log combined
</VirtualHost>
