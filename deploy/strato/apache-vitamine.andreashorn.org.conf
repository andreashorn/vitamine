<VirtualHost *:80>
    ServerName vitamine.andreashorn.org

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8766/
    ProxyPassReverse / http://127.0.0.1:8766/

    ErrorLog ${APACHE_LOG_DIR}/vitamine-andreashorn-org-error.log
    CustomLog ${APACHE_LOG_DIR}/vitamine-andreashorn-org-access.log combined
</VirtualHost>
