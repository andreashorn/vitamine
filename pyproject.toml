[project]
name = "vitamine"
version = "0.1.0"
description = "Local CV and biosketch workbench"
requires-python = ">=3.9"
dependencies = [
  "citeproc-py[full]==0.9.3",
  "cryptography>=42,<47",
  "eval-type-backport",
  "fastapi",
  "Pillow>=10,<12",
  "python-docx",
  "python-multipart",
  "pypdf",
  "uvicorn",
]

[tool.setuptools]
packages = ["vitamine", "vitamine.scripts"]
